name: Deploy

# Single entry point for all site deployments. This is the ONLY workflow that
# triggers on push — it never runs the actual build/rsync itself. Instead it
# figures out which site folder(s) changed and calls that site's own
# reusable workflow file (deploy-<site>.yml). That keeps deployment logic
# for each site in its own file (easy to read, easy to touch one site
# without risking another) while guaranteeing only ONE workflow run happens
# per push, instead of several independent workflows firing off in parallel.

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      site:
        description: 'Force a deploy regardless of which files changed'
        type: choice
        default: auto
        options:
          - auto
          - all
          - amowogbaje
          - catherine
          - demos

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      amowogbaje: ${{ steps.filter.outputs.amowogbaje }}
      catherine: ${{ steps.filter.outputs.catherine }}
      demos: ${{ steps.filter.outputs.demos }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            amowogbaje:
              - 'amowogbaje/**'
            catherine:
              - 'catherine/**'
            demos:
              - 'demos/**'

  deploy-amowogbaje:
    name: Deploy amowogbaje.com
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.amowogbaje == 'true' ||
      github.event.inputs.site == 'all' ||
      github.event.inputs.site == 'amowogbaje'
    uses: ./.github/workflows/deploy-amowogbaje.yml
    secrets: inherit

  deploy-catherine:
    name: Deploy catherine.amowogbaje.com
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.catherine == 'true' ||
      github.event.inputs.site == 'all' ||
      github.event.inputs.site == 'catherine'
    uses: ./.github/workflows/deploy-catherine.yml
    secrets: inherit

  deploy-demos:
    name: Deploy demos.amowogbaje.com
    needs: detect-changes
    if: >-
      needs.detect-changes.outputs.demos == 'true' ||
      github.event.inputs.site == 'all' ||
      github.event.inputs.site == 'demos'
    uses: ./.github/workflows/deploy-demos.yml
    secrets: inherit